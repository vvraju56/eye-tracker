database:
  - name: eyetracker
    plan: free
    database_name: eyetracker
    ip_allowlist: []

services:
  - type: web
    name: eye-tracker-api
    runtime: python311
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eyetracker
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "true"